name: Publish to npm

# Fires when a GitHub Release is published. Create the release from a tag
# named after the package version, and the guard below refuses
# to publish if the two ever disagree.
on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm attach a provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      # A release tag that disagrees with package.json means someone forgot to
      # bump. Publishing anyway would burn the wrong version number forever.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag is $tag but package.json says $pkg."
            echo "Run 'npm version <patch|minor|major>' and tag that commit."
            exit 1
          fi

      # Republishing an existing version fails the whole run, so skip instead:
      # a re-run of an already published release should be a no-op, not an error.
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@vcxcvii/rainmaker@$version" version >/dev/null 2>&1; then
            echo "@vcxcvii/rainmaker@$version is already on npm. Nothing to do."
            exit 0
          fi
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
