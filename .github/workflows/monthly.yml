name: Monthly Rainmaker report

on:
  schedule:
    - cron: "0 14 1 * *" # first of the month, 14:00 UTC
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      RAINMAKER_TARGET_REPO: ${{ github.repository }}
      CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: ${{ secrets.GOOGLE_SA_KEY != '' }}
        run: |
          echo '${{ secrets.GOOGLE_SA_KEY }}' > google-service-account.local.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=./google-service-account.local.json" >> "$GITHUB_ENV"
      - run: npm run build
      - run: node dist/cli.js audit --refresh
      - run: node dist/cli.js report --window month
      - run: node dist/cli.js ledger --compact
      - uses: actions/upload-artifact@v4
        with:
          name: rainmaker-monthly-report
          path: reports/
